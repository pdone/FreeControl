<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 品牌标识引用镜像进来的资产包成品位图（与产品界面同源） -->
    <link rel="icon" type="image/png" href="/assets/icons/desktop/128x128.png" />
    <title>FreeControl — 在 PC 上控制 Android 设备</title>
    <meta
      name="description"
      content="FreeControl 是 scrcpy 的图形启动器：设备清单、参数面板、连接控制与运行环境，都在一个免安装的 Windows 桌面程序里。"
    />
    <meta name="theme-color" content="#0b0d11" />
    <!-- 首帧底色：与 tokens.css 两档的 --bg 同值（各一份），避免"另一种底色"闪一下。
         这一段只服务样式表与脚本都没到位的那一瞬；两档的完整 token 在 tokens.css 里。 -->
    <style>
      html {
        background-color: #0b0d11;
      }
      html[data-theme='light'] {
        background-color: #f2f4f7;
      }
    </style>
    <!-- 首帧外观：必须**同步**执行，且排在上面的底色之后、样式表与 main.ts 之前 ——
         否则浅色系统的访客会先看到一帧深底。站点只有深/浅两档：站内选过就用存的，
         没选过就按系统颜色模式定（旧版本存过的 system 也一并按"没选过"处理）。
         存储被拦时不写 data-theme，交给 tokens.css 那段 prefers-color-scheme 兜底
         （与 lib/theme.ts 的降级同一条）。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('freecontrol2-website-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f2f4f7' : '#0b0d11');
        } catch (e) {
          /* 存储不可用：不写 data-theme，页面按系统呈现 */
        }
      })();
    </script>
    <!-- 图标数据随包提供（`src/lib/icon-set.ts`，由 scripts/gen-icon-subset.mjs 生成），不走 CDN：
         站内与内嵌原型同用一份入库子集，首屏无第三方脚本。 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
