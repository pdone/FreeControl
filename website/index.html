<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 品牌标识引用镜像进来的资产包成品位图（与产品界面同源） -->
    <link rel="icon" type="image/png" href="/assets/icons/desktop/128x128.png" />
    <title>FreeControl — 在 PC 上控制 Android 设备</title>
    <meta
      name="description"
      content="FreeControl 是 scrcpy 的图形启动器：设备清单、参数面板、连接控制与运行环境，都在一个免安装的 Windows 桌面程序里。"
    />
    <meta name="theme-color" content="#0b0d11" />
    <!-- 首帧底色：与 tokens.css 的 --bg 同一份深色，避免白底一闪 -->
    <style>
      html {
        background-color: #0b0d11;
      }
    </style>
    <!-- 图标数据随包提供（`src/lib/icon-set.ts`，由 scripts/gen-icon-subset.mjs 生成），不走 CDN：
         站内与内嵌原型同用一份入库子集，首屏无第三方脚本。 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
