# 构建与校验（spec `release-build` / design D9）。
#
# 触发分级：
#   - 推送到 main：只跑 `check`（编译 + 单测），不打包、不上传任何产物；
#   - 手动触发：`check` → `build` → `release`，出包并汇集成一次**草稿**发行（不自动发布）。
#
# 每个产物的构建主机与它自身的操作系统**与架构**一致（MUST NOT 依赖交叉编译）：
#   - Windows x64（`windows-latest`）与 Windows ARM64（`windows-11-arm`）：`--no-bundle`，
#     各产出一份裸 exe（免安装单文件）；
#   - Linux x86_64：`--bundles appimage,deb`；
#   - macOS ARM64（`macos-15`）与 macOS x86_64（`macos-15-intel`）：`--bundles app,dmg`，
#     各产出一份 dmg。`app` 不能省：只请求 `dmg` 时 bundler 把 `.app` 当中间件，打完 dmg 就地
#     删掉（日志里的 `Cleaning .../bundle/macos/FreeControl2.app`），随后的自检便无据可查。
#     `macos-15-intel` 是 GitHub 最后一个 x86_64 镜像，预计 2027 年秋下线，
#     届时需另开变更决定删掉该档还是换自托管 runner。
#
# 纯文档类改动（`paths-ignore`）不触发校验；品牌资产包（`assets/icons/**`）与
# `scripts/**` 参与构建，刻意不在豁免清单里 —— 豁免只到 `assets/screenshots/`
# 这个仅被 README 引用的截图目录，不扩到整个 `assets/**`。
#
# 各 `uses:` 一律取**声明 node24** 的那一档大版本：只声明 `node20` 的 action 会被
# GitHub 强制改在 node24 上运行，并每次报一条弃用警告（Node20 已于 2026-09-23 从
# runner 移除）。runner 标签同样显式写死，不用会自行迁移的 `ubuntu-latest`
# （自 2026-10-19 起灰度指向 26.04）：`ubuntu-22.04` 是 AppImage 的 glibc 基线，
# `release` 不编译、钉 `ubuntu-24.04`。

name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "openspec/**"
      - "ui-design/**"
      - "assets/screenshots/**"
      - "**/*.md"
  workflow_dispatch:

# 同一分支上接连推送时，取消还在跑的旧一次，只保留最后一次（design D9）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 校验（编译 + 单测）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          # macOS 的 `cfg` 分支在开发机上编不到，单测按 OS 覆盖只能靠这条腿；
          # 架构无关，Intel 那条出包腿也会完整编译一遍。
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust（稳定版，宿主目标）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri 在 Linux 上要链接 webkit2gtk / gtk 等，`cargo test` 同样需要 ——
      # 省不掉「准备环境」，省掉的是打包那一段（design D9）。
      # 缺依赖时以 apt 的报错呈现是哪一项缺失，而不是一段编译期链接错误（spec `release-build`）。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - name: 安装前端依赖（锁文件驱动）
        run: npm ci

      - name: Rust 单测
        run: npm run test:rs

      # 前端检查与 Vite 构建与平台无关，只跑一次（design D9）。
      - name: 前端检查
        if: runner.os == 'Linux'
        run: npm run check

      - name: 前端构建
        if: runner.os == 'Linux'
        run: npm run build

  build:
    name: 出包
    needs: check
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --no-bundle
            arch: x64
          # ARM64 用 GitHub 托管的原生 ARM64 runner（2026-08 GA）：产物由该架构自己的
          # 主机原生构建，不碰交叉编译（spec `release-build`）。它跑完后的 exe 里
          # `std::env::consts::ARCH` 才是 aarch64，运行环境才会取 winarm64 的 scrcpy。
          - os: windows-11-arm
            args: --no-bundle
            arch: arm64
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          # 两条 macOS 腿各出原生 dmg：`lipo` 自检保证 arm64 那份不经仿真。
          # `app` 与 `dmg` 一并请求：只请求 `dmg` 时 bundler 自造 `.app` 后又在收尾把它清掉，
          # 点名 `app` 后 `.app` 作为正式产物留在 `bundle/macos/`，自检才有据可查，也免去重造。
          - os: macos-15
            args: --bundles app,dmg
            arch: aarch64
          - os: macos-15-intel
            args: --bundles app,dmg
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - name: 安装前端依赖（锁文件驱动）
        run: npm ci

      - name: 构建（`beforeBuildCommand` 自带 `vite build`）
        run: npm run tauri build -- ${{ matrix.args }}

      # Windows 的裸 exe 基础名来自 `mainBinaryName`（`FreeControl2`），平台段、版本段与架构段
      # 都由这里补上：从 `tauri.conf.json` 读版本号（单一来源，工作流里不另写版本字面量），
      # 只改名、不改内容。三平台统一为 `{产品名}_{版本}_{平台}_{架构}`（spec `release-build`）。
      - name: Windows 产物按应用版本、平台与架构命名
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $src = "src-tauri/target/release/FreeControl2.exe"
          $dst = "src-tauri/target/release/FreeControl2_${version}_windows_${{ matrix.arch }}.exe"
          if (-not (Test-Path $src)) { throw "找不到构建产物 $src" }
          Move-Item $src $dst
          Write-Host "产物：$dst"

      # 无 ARM64 实机时，「构建成功」不等于「产物架构正确」——配置写错会安静地产出 x64
      # 却叫 arm64。这里读 PE 头的 Machine 字段自证：x64 = 0x8664、ARM64 = 0xAA64
      # （`IMAGE_FILE_MACHINE_*`），不需要运行二进制，也不依赖实机。
      - name: 校验产物架构（PE 头 Machine 字段）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $file = "src-tauri/target/release/FreeControl2_${version}_windows_${{ matrix.arch }}.exe"
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          $bytes = [IO.File]::ReadAllBytes($file)
          $eLfanew = [BitConverter]::ToInt32($bytes, 0x3C)          # PE 签名在文件中的偏移
          $machine = [BitConverter]::ToUInt16($bytes, $eLfanew + 4) # IMAGE_FILE_HEADER.Machine
          Write-Host ("PE Machine = 0x{0:X4}（期望 0x{1:X4}）" -f $machine, $expected)
          if ($machine -ne $expected) { throw "产物架构不符：$file 的 Machine=0x$('{0:X4}' -f $machine)" }

      # macOS 的 dmg 由 bundler 按 `{产品名}_{版本}_{aarch64|x64}` 命名，这里改写为
      # `macos_{arm64|x64}`：补齐平台段，架构段换成该平台自己的叫法（macOS 上 `uname -m`
      # 报的是 `arm64`，`aarch64` 只是编译器目标的叫法）。改名只动文件名，dmg 内的 `.app`
      # 与它上面的 ad-hoc 签名都不受影响。这一步排在自检之前，自检读的就是最终要上传的名字。
      - name: macOS 产物按应用版本、平台与架构命名
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.arch }}" in
            aarch64) SEG=arm64 ;;
            x64) SEG=x64 ;;
            *) echo "::error::未知架构 ${{ matrix.arch }}"; exit 1 ;;
          esac
          SRC="src-tauri/target/release/bundle/dmg/FreeControl2_${VERSION}_${{ matrix.arch }}.dmg"
          DST="src-tauri/target/release/bundle/dmg/FreeControl2_${VERSION}_macos_${SEG}.dmg"
          [ -f "$SRC" ] || { echo "::error::找不到构建产物 $SRC"; exit 1; }
          mv "$SRC" "$DST"
          echo "产物：$DST"

      # 无 Apple 实机时，「构建成功」不等于「产物架构与签名形态正确」—— 与 Windows 读 PE 头对应。
      # 1) `lipo -archs` 必须**恰好**是该腿的架构（含两个架构也判失败，防止误出 universal）；
      # 2) ad-hoc 签名是 Apple 芯片能运行的最低门槛（`bundle.macOS.signingIdentity = "-"`）；
      # 3) `minos` 只记日志，用于核对 `minimumSystemVersion`；
      # 4) dmg 恰好一份，文件名是改名后的 `_macos_{arm64|x64}.dmg`，且不残留 `aarch64`。
      # 检查 `.app` 而不是挂载 dmg：dmg 是 Tauri 从同一个 `.app` 打出来的，多一次
      # `hdiutil attach` 只会在 runner 上多一个偶发失败点。
      # 这份 `.app` 靠出包参数里的 `app` 保住 —— 只请求 `dmg` 时 bundler 会删掉它
      # （2026-10-24 首次手动出包即因此两腿同时失败，run 40073851524）。
      - name: 校验产物架构与签名（Mach-O）
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/release/bundle/macos/FreeControl2.app"
          BIN="$APP/Contents/MacOS/FreeControl2"
          [ -f "$BIN" ] || { echo "::error::找不到 $BIN"; exit 1; }

          case "${{ matrix.arch }}" in
            aarch64) EXPECTED=arm64; SEG=arm64 ;;
            x64) EXPECTED=x86_64; SEG=x64 ;;
            *) echo "::error::未知架构 ${{ matrix.arch }}"; exit 1 ;;
          esac
          ARCHS=$(lipo -archs "$BIN")
          echo "Mach-O 架构：$ARCHS（期望恰为 $EXPECTED）"
          if [ "$ARCHS" != "$EXPECTED" ]; then
            echo "::error::产物架构不符：$BIN 的 archs=$ARCHS"
            exit 1
          fi

          SIGNATURE=$(codesign -dv "$APP" 2>&1)
          echo "$SIGNATURE"
          echo "$SIGNATURE" | grep -q 'Signature=adhoc' \
            || { echo "::error::$APP 不是 ad-hoc 签名"; exit 1; }

          echo "部署目标：$(vtool -show-build "$BIN" | awk '/minos/ {print $2}')"

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG="src-tauri/target/release/bundle/dmg/FreeControl2_${VERSION}_macos_${SEG}.dmg"
          [ -f "$DMG" ] || { echo "::error::找不到 $DMG"; exit 1; }
          COUNT=$(ls src-tauri/target/release/bundle/dmg/*.dmg | wc -l)
          [ "$COUNT" -eq 1 ] || { echo "::error::dmg 数量应为 1，实际 $COUNT"; exit 1; }
          echo "产物：$DMG"

      # artifact 名按架构区分：upload-artifact v4 起同一 run 内同名会失败；
      # release 作业用 `merge-multiple` 合并，因此名字不同不影响最终汇集。
      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FreeControl2-windows-${{ matrix.arch }}
          path: src-tauri/target/release/FreeControl2_*.exe
          if-no-files-found: error

      # Linux 两份的默认名带打包架构段（`_amd64`），这里补平台段，与三平台统一为
      # `{产品名}_{版本}_{平台}_{架构}`（spec `release-build`）。只改名、不改内容：
      # deb 的包内元数据与 AppImage 的自解压头都不依赖文件名。架构段用 dpkg 的 `amd64`，
      # 不跟 Windows / macOS 的 `x64` 混用。
      - name: Linux 产物按应用版本、平台与架构命名
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APPIMAGE="src-tauri/target/release/bundle/appimage/FreeControl2_${VERSION}_amd64.AppImage"
          DEB="src-tauri/target/release/bundle/deb/FreeControl2_${VERSION}_amd64.deb"
          [ -f "$APPIMAGE" ] || { echo "::error::找不到构建产物 $APPIMAGE"; exit 1; }
          [ -f "$DEB" ] || { echo "::error::找不到构建产物 $DEB"; exit 1; }
          mv "$APPIMAGE" "src-tauri/target/release/bundle/appimage/FreeControl2_${VERSION}_linux_amd64.AppImage"
          mv "$DEB" "src-tauri/target/release/bundle/deb/FreeControl2_${VERSION}_linux_amd64.deb"
          ls -l src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: FreeControl2-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # 只给一个通配路径时，下载产物（`merge-multiple`）会落回 `dist/` 根目录，
      # 与 Windows exe 同层，`ASSETS` 据此点名。
      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: FreeControl2-macos-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 只创建**草稿**：发布动作由人在确认产物后点一次（design D9）。
  # 用 gh 而非第三方 action：少一个需要信任的第三方步骤；同 tag 已有草稿时只追加文件。
  #
  # 发布完成之后再走一步（spec `project-website` 的「发行发布后官网随之重新部署」）：
  # 把 website/version 写成本次 tag（如 v1.0.1）并推送到 main，触发官网重新部署。
  # 这一步不能省，也不能并进升版那次推送 —— 官网在构建期解析「最新发行」来生成下载直链，
  # 而发行正是发布之后才存在的，升版那次重建拿到的仍是上一个发行。
  release:
    name: 汇集成草稿发行
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 读应用版本（单一来源：`tauri.conf.json`）
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # 正文取自两份更新日志中该版本的中英两节（spec `release-build`「草稿发行的正文取自更新日志」）。
      # 取不到时退回通用说明并留痕 —— 产物优先：正文缺失不该让这次产物取不回来（design D4）。
      - name: 生成草稿正文（取自更新日志）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FALLBACK="自动构建的草稿发行。Windows 产物为免安装单文件（x64 与 ARM64 各一份）；macOS 产物为 dmg（Apple 芯片与 Intel 各一份，ad-hoc 签名，首次打开需按 README 放行）；请人工确认后再发布。"
          if node scripts/release-notes.mjs "$VERSION" --out notes.md; then
            SOURCE="更新日志 v$VERSION（Update.md / Update.en.md）"
          else
            echo "::warning::更新日志里没有 v$VERSION 的条目，草稿正文退回通用说明。"
            printf '未在更新日志中找到 v%s 的条目，以下是这次出包的通用说明，请人工补充。\n\n%s\n' \
              "$VERSION" "$FALLBACK" > notes.md
            SOURCE="通用说明（更新日志缺 v$VERSION 一节）"
          fi
          {
            echo "### 草稿正文"
            echo ""
            echo "- 来源：$SOURCE"
            echo "- 版本：v$VERSION"
            echo "- 正文文件：$(wc -c < notes.md | tr -d ' ') 字节"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 下载三平台产物（合并到一个目录）
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 创建或追加到草稿发行（同版本已发布时不覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          # 逐个点名六份产物，**不写 `dist/*`**：下载步骤保留了上传时的相对路径 —— Linux
          # 那两份来自 `bundle/appimage/` 与 `bundle/deb/`，于是 `dist/` 里还多出 `appimage/`、
          # `deb/` 两个目录，一并交给 gh 会报 `read dist/deb: is a directory`
          # （2026-10-10 首次手动触发实测）。macOS 的 dmg 走单一通配路径上传，落在 `dist/` 根目录。
          # 少一份时通配符保持字面量，gh 会报「文件不存在」而失败 —— 与上传步骤的
          # `if-no-files-found: error` 同一口径，不静默少传。
          # 六个名字与三平台改名步骤（`{产品名}_{版本}_{平台}_{架构}`）逐字对齐。
          ASSETS=(dist/*_windows_x64.exe dist/*_windows_arm64.exe \
                  dist/appimage/*_linux_amd64.AppImage dist/deb/*_linux_amd64.deb \
                  dist/*_macos_arm64.dmg dist/*_macos_x64.dmg)
          ls -l "${ASSETS[@]}"
          {
            echo "### 本次产物"
            echo ""
            for asset in "${ASSETS[@]}"; do echo "- $(basename "$asset")"; done
          } >> "$GITHUB_STEP_SUMMARY"

          # 既有发行的三种状态：none / draft / published。
          # `--jq '.isDraft'` 对草稿给 true、对已发布给 false；tag 不存在时命令非零退出，按 none 处理。
          state_of() {
            if ! out=$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
              echo none
            elif [ "$out" = "true" ]; then
              echo draft
            else
              echo published
            fi
          }

          # 规则（spec `release-build`「产物以草稿发行汇集且不强制签名」）：
          #   同 tag 是草稿     -> 覆盖它（同版本重出只留最后一份，既有语义不变）；
          #   同 tag 已发布     -> 一律不碰已发布的任何产物，本次产物改落 `v{版本}-draft` 取件草稿；
          #   取件草稿已被发布  -> 按约定它永不发布，直接失败交人处理（绝不覆盖已发布内容）。
          TARGET="$TAG"
          STATE=$(state_of "$TAG")
          if [ "$STATE" = "published" ]; then
            TARGET="${TAG}-draft"
            STATE=$(state_of "$TARGET")
            if [ "$STATE" = "published" ]; then
              echo "::error::取件草稿 $TARGET 已被发布；它按约定永不发布，请人工确认后再出包。" >&2
              exit 1
            fi
            echo "::warning::$TAG 已发布，本次产物落到取件草稿 $TARGET（该草稿只用于取件，永不发布）。"
          fi

          # 正文：只有正式档位（TARGET == TAG）贴更新日志；取件草稿换回取件说明
          # （spec「取件草稿不贴更新日志」）。
          if [ "$TARGET" != "$TAG" ]; then
            printf '取件草稿：%s 已发布，这里只用于取回同版本的新产物 —— 永不发布。确认后如需正式发行，请先升版本再出包。\n' \
              "$TAG" > notes.md
            echo "- 正文：已换回取件说明（$TARGET 不贴更新日志）" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$STATE" = "none" ]; then
            gh release create "$TARGET" --draft \
              --title "FreeControl2 $TARGET" \
              --notes-file notes.md \
              "${ASSETS[@]}"
          else
            gh release upload "$TARGET" --clobber "${ASSETS[@]}"
            # 同版本重出时正文也要跟着刷新，否则停在上一次出包的内容（design D5）。
            gh release edit "$TARGET" --notes-file notes.md
          fi
